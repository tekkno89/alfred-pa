[project]
name = "alfred-desktop"
version = "0.1.0"
description = "Voice agent POC for Alfred AI assistant"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[whisper]>=0.0.78",
    "mlx-whisper>=0.4.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pyaudio>=0.2.14",
    "webrtcvad>=2.0.10",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "websockets>=12.0",
    "pysbd>=0.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# TTS Providers (install ONE of these, they're mutually exclusive):
#   Chatterbox: uv pip install chatterbox-tts --no-deps && uv pip install --force-reinstall torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0
#   Qwen3-TTS:  uv pip install qwen-tts

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
